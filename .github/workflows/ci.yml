# Lint, test, check and build every module (docs/ARCHITECTURE.md §6).
#
# The ported crates (`src/` of the modules whose `module.toml` says `ported`) are compiled with Clippy against the
# pinned Sunrise SDK (`cargo creature native-check`, which fetches it); the game build itself happens in the launcher
# (`cargo creature install`). `cargo sunrise-mod` is the signed newest tool, the one the registry's release workflow
# (sunrise-release-<id>.yml) runs. A release isn't made here: a tag `<id>/v<version>` makes it (docs/PUBLISHING.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The series' pinned Sunrise build (every sunrise-mod.toml's [native] sunrise; `cargo creature check` enforces it),
  # for sunrise-stage (each package's uses.json).
  SUNRISE_REV: 94256510f74e6843754e0a93fd9e4da7e45b1056

jobs:
  lint:
    name: Format, lint, test, check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools
      - name: rustfmt (tools)
        run: cargo fmt --manifest-path tools/Cargo.toml --check
      - name: rustfmt (native code)
        run: find common mods -path '*/src/*' -not -path '*/.sunrise/*' -name '*.rs' -print0 | xargs -0 rustfmt --edition 2024 --check
      - name: clippy (tools)
        run: cargo clippy --manifest-path tools/Cargo.toml --all-targets --locked -- -D warnings
      - name: tests (tools)
        run: cargo test --manifest-path tools/Cargo.toml --locked
      - name: Repository consistency
        run: cargo creature check

  native:
    name: Native code (Clippy and tests against the pinned Sunrise SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            tools
            target/native-check
      # The signed newest tool, as the registry's release workflow installs it (Sunrise's "Install the mod tool",
      # "Newest tool from main"): its signature checked against Sunrise's key before it runs.
      - name: Install cargo-sunrise-mod (signed mod-tool)
        run: |
          set -eu
          BASE=https://github.com/sunrise-org/sunrise/releases/download/mod-tool
          KEY=r53xb3cuafGxZSicLz06KC+xXp9NJdPH8snNmXo5pAc=
          TOOL=tool-x86_64-unknown-linux-gnu.tar.xz
          cd "$(mktemp -d)"
          curl -fsSLO "$BASE/$TOOL"
          curl -fsSLO "$BASE/SHA256SUMS"
          curl -fsSLO "$BASE/SHA256SUMS.sig"
          printf 'horizon release mod-tool\n' | cat - SHA256SUMS > message
          { printf '\060\052\060\005\006\003\053\145\160\003\041\000'; printf '%s' "$KEY" | openssl base64 -d -A; } > key.der
          signed=
          while read -r line || [ -n "$line" ]; do
            printf '%s' "$line" | openssl base64 -d -A > signature
            openssl pkeyutl -verify -rawin -pubin -keyform DER -inkey key.der -in message -sigfile signature > /dev/null 2>&1 && signed=1
          done < SHA256SUMS.sig
          [ -n "$signed" ] || { echo "SHA256SUMS is not signed by Sunrise" >&2; exit 1; }
          grep " $TOOL\$" SHA256SUMS | sha256sum -c -
          tar -xJf "$TOOL"
          install -Dm755 cargo-sunrise-mod "$HOME/.local/bin/cargo-sunrise-mod"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/cargo-sunrise-mod" sunrise-mod --version
      - name: Clippy and tests on the ported crates
        run: cargo creature native-check

  build:
    name: Build the mods
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools
      # The signed newest tool, as the registry's release workflow installs it (Sunrise's "Install the mod tool",
      # "Newest tool from main"): its signature checked against Sunrise's key before it runs.
      - name: Install cargo-sunrise-mod (signed mod-tool)
        run: |
          set -eu
          BASE=https://github.com/sunrise-org/sunrise/releases/download/mod-tool
          KEY=r53xb3cuafGxZSicLz06KC+xXp9NJdPH8snNmXo5pAc=
          TOOL=tool-x86_64-unknown-linux-gnu.tar.xz
          cd "$(mktemp -d)"
          curl -fsSLO "$BASE/$TOOL"
          curl -fsSLO "$BASE/SHA256SUMS"
          curl -fsSLO "$BASE/SHA256SUMS.sig"
          printf 'horizon release mod-tool\n' | cat - SHA256SUMS > message
          { printf '\060\052\060\005\006\003\053\145\160\003\041\000'; printf '%s' "$KEY" | openssl base64 -d -A; } > key.der
          signed=
          while read -r line || [ -n "$line" ]; do
            printf '%s' "$line" | openssl base64 -d -A > signature
            openssl pkeyutl -verify -rawin -pubin -keyform DER -inkey key.der -in message -sigfile signature > /dev/null 2>&1 && signed=1
          done < SHA256SUMS.sig
          [ -n "$signed" ] || { echo "SHA256SUMS is not signed by Sunrise" >&2; exit 1; }
          grep " $TOOL\$" SHA256SUMS | sha256sum -c -
          tar -xJf "$TOOL"
          install -Dm755 cargo-sunrise-mod "$HOME/.local/bin/cargo-sunrise-mod"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/cargo-sunrise-mod" sunrise-mod --version
      # Writes each package's uses.json (tools/src/pack.rs, `uses`).
      - name: Cache sunrise-stage
        id: sunrise-stage
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/sunrise-stage
          key: sunrise-stage-${{ runner.os }}-${{ env.SUNRISE_REV }}
      - name: Install sunrise-stage
        if: steps.sunrise-stage.outputs.cache-hit != 'true'
        run: cargo install --force --locked --git https://github.com/sunrise-org/sunrise --rev "$SUNRISE_REV" sunrise-mod-api-gen --bin sunrise-stage
      - name: Build the packages (.smod)
        run: cargo creature build
      - uses: actions/upload-artifact@v7
        with:
          name: sunrise-creatures-${{ github.sha }}
          path: target/dist/
          if-no-files-found: error
