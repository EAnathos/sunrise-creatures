# Seagulls's description for the repository's tools (docs/ARCHITECTURE.md); not shipped in the mod.
id = "seagulls"
name = "Seagulls"
status = "playable"
# Its items in the series' creative tab, in order.
creative = [
  "seagulls:seagull_spawn_egg",
  "seagulls:raw_seagull",
  "seagulls:cooked_seagull",
]
# Its Rust is built on Sunrise's mod_api.
ported = true


# Its page in Sunrise's registry (`cargo creature release`, docs/PUBLISHING.md): with its manifest's name, authors and
# licence, and its README as the description.
[registry]
summary = "Noisy gulls of the coasts that float on the waves, follow your boat and snatch food from your hand; befriend one with fish and it fishes for you."
categories = ["mobs"]
icon = "seagull"
screenshots = ["mods/seagulls/page/1-seagulls.jpg", "docs/models/seagulls-seagull-front.png", "docs/models/seagulls-seagull-back.png"]
