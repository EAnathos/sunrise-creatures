# Toucan's description for the repository's tools (docs/ARCHITECTURE.md); not shipped in the mod.
id = "toucan"
name = "Toucan"
status = "playable"
# Its items in the series' creative tab, in order.
creative = [
  "toucan:toucan_spawn_egg",
  "toucan:raw_toucan",
  "toucan:cooked_toucan",
]
# Its Rust is built on Sunrise's mod_api.
ported = true

# Its page in Sunrise's registry (`cargo creature release`, docs/PUBLISHING.md): with its manifest's name, authors and
# licence, and its README as the description.
[registry]
summary = "A tropical bird of the jungle canopy with an oversized colourful bill, hopping on the leaves and flitting between the trees; tame one with melon slices."
categories = ["mobs"]
icon = "toucan"
screenshots = [
  "mods/toucan/page/1-toucan.jpg",
  "docs/models/toucan-toucan-front.png",
  "docs/models/toucan-toucan-back.png",
]
