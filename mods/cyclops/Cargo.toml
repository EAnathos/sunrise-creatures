[package]
name = "mod-cyclops"
# The module's version is its sunrise-mod.toml's (`cargo creature bump`): the crate's stays 0.0.0.
version = "0.0.0"
edition = "2024"

[dependencies]
# The pinned SDK's API crate, fetched into .sunrise/sdk/ by any `cargo sunrise-mod` command.
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
